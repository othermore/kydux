# The game served to a few friends over the internet, by nginx on the owner's
# machine (docs/dev/dev-environment.md, "Opening the game to friends"): the built
# game from /srv/kydux, HTTPS only, behind a password. Copied by ci/deploy.sh to
# /etc/nginx/sites-available/kydux and enabled from there.
#
# The headers are the ones the development server sends (app/vite.config.ts):
# the page cross-origin isolated, so that SharedArrayBuffer exists and a
# runaway program can be stopped (D11), and a Content-Security-Policy that keeps
# the page, and the child's code with it, to the game's own origin (D14, D19).
# The certificate is Let's Encrypt's, made and renewed by certbot before this
# site is enabled; its TLS settings are here, needing no file of certbot's but
# the certificate. Port 80 answers only certbot's challenge, for the renewals,
# and sends everything else to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name kydux.kidux.org;

    # Let's Encrypt proves the name is ours by fetching a file from here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kydux.kidux.org;

    ssl_certificate /etc/letsencrypt/live/kydux.kidux.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kydux.kidux.org/privkey.pem;
    # TLS 1.2 and 1.3 only, with the ciphers every current browser has.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:kydux:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/kydux;
    index index.html;

    # The page loads Pyodide as a JavaScript module, pyodide.mjs, and a browser
    # refuses a module served as anything but JavaScript: nginx's own table
    # knows js and wasm but not mjs, so it is named here beside them.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # The password: one line a friend, made with deploy/password.sh.
    auth_basic "Kydux";
    auth_basic_user_file /etc/nginx/kydux.htpasswd;

    # What the game needs of every answer (app/vite.config.ts). The locations
    # below set their caching with expires alone, never add_header, so that
    # they inherit these.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The build's code carries its content's hash in its name: a new build is
    # new names, so the browser keeps these for good.
    location /assets/ {
        expires max;
    }

    # Everything else keeps its name from one build to the next (the content,
    # world.zip, Pyodide, the page): the browser asks each time whether it
    # changed, and nginx answers "not modified" when it did not.
    location / {
        try_files $uri $uri/ /index.html;
        expires epoch;
    }

    # Compressed on the way, except what is compressed already.
    gzip on;
    gzip_types application/javascript text/css application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
}
