[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kydux-world"
version = "0.0.3"
description = "The model of Kydux's levels: the world a child's Python runs in"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.setuptools]
packages = ["kydux_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
