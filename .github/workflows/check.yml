# Every check on every push and pull request (ci/check.sh). Pushes reach
# GitHub only inside the project's hours (ci/push.sh), so these runs do too.
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The world's environment
        run: pip install -e 'world[dev]'
      - name: Every check
        run: ci/check.sh
