# The game served to a few friends over the internet, by nginx on the owner's
# machine (docs/dev/dev-environment.md, "Opening the game to friends"): the built
# game from /srv/kydux, HTTPS only, behind a password. Copied by ci/deploy.sh to
# /etc/nginx/sites-available/kydux and enabled from there.
#
# The headers are the ones the development server sends (app/vite.config.ts):
# the page cross-origin isolated, so that SharedArrayBuffer exists and a
# runaway program can be stopped (D11), and a Content-Security-Policy that keeps
# the page, and the child's code with it, to the game's own origin (D14, D19).
# The certificate is Let's Encrypt's, made and renewed by certbot; port 80
# answers only certbot's challenge and sends everything else to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name kydux.kidux.org;

    # Let's Encrypt proves the name is ours by fetching a file from here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kydux.kidux.org;

    ssl_certificate /etc/letsencrypt/live/kydux.kidux.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kydux.kidux.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/kydux;
    index index.html;

    # The password: one line a friend, made with deploy/password.sh.
    auth_basic "Kydux";
    auth_basic_user_file /etc/nginx/kydux.htpasswd;

    # What the game needs of every answer (app/vite.config.ts).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Pyodide and the content are large and never change under one build: the
    # browser keeps them a week. The page itself is always asked for again.
    location ~* \.(wasm|zip|js|mjs|css|webp|png|json|data|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Compressed on the way, except what is compressed already.
    gzip on;
    gzip_types application/javascript text/css application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
}
