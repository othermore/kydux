# Every check but the browser tests on every push, tag and pull request
# (ci/check.sh); the browser tests too (ci/check.sh --e2e) only when the run is
# started by hand (D179): on hija they pass before every sprint's last commit,
# and here they take hours and run out of their time. Pushes and tags reach
# GitHub only inside the project's hours (ci/push.sh), so these runs do too.
name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The world's environment, and the tools'
        run: |
          pip install -e 'world[dev]'
          pip install -r tools/requirements.txt
      - name: Every check
        run: ci/check.sh

  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The world's environment, and the tools'
        run: |
          pip install -e 'world[dev]'
          pip install -r tools/requirements.txt
      - name: The app's dependencies and browser
        working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Every check, and the browser tests
        run: ci/check.sh --e2e
      - name: The browser tests' report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report/
