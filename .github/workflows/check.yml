# Every check but the browser tests (ci/check.sh) on every push, tag and pull
# request, and when the run is started by hand. The browser tests run on hija
# alone (ci/check.sh --e2e, before every sprint's last commit), and no run
# stores anything here (D325). Pushes and tags reach GitHub only inside the
# project's hours (ci/push.sh), so these runs do too.
name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The world's environment, and the tools'
        run: |
          pip install -e 'world[dev]'
          pip install -r tools/requirements.txt
      - name: Every check
        run: ci/check.sh
